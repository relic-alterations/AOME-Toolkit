version: '3.8'

services:
  aome:
    # To build and test locally instantly without pushing to GitHub, comment out 'image' and uncomment 'build: .'
    # build: .
    image: ghcr.io/relic-alterations/aome-toolkit:main
    ports:
      - "8000:8000"
    volumes:
      # Map the user's local ~/AOME folder to the container's root ~/AOME folder
      - ${HOME}/AOME:/root/AOME
      
      # Persist the SQLite database so you don't lose your MakeMKV Key and settings
      - ./backend/aome.db:/app/backend/aome.db
      
      # UNCOMMENT and configure this to pass your network drives/NAS into the container
      # so AOME can automatically transfer finished transcodes there:
      # - /mnt/nas/Media:/mnt/nas/Media
      
    devices:
      # Pass the optical drive through to the container. 
      # MakeMKV requires BOTH the sr* block device and the sg* SCSI generic devices!
      - "/dev/sr0:/dev/sr0"
      - "/dev/sg0:/dev/sg0"
      - "/dev/sg1:/dev/sg1"
      - "/dev/sg2:/dev/sg2"
    privileged: true # Often required for full SCSI command access to optical drives
    restart: unless-stopped
