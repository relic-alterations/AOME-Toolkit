version: '3.8'

services:
  aome:
    image: ghcr.io/relic-alterations/aome-toolkit:main
    ports:
      - "8000:8000"
    volumes:
      # Map the user's local ~/AOME folder to the container's root ~/AOME folder
      - ${HOME}/AOME:/root/AOME
      
      # Persist the SQLite database so you don't lose your MakeMKV Key and settings
      - ./backend/aome.db:/app/backend/aome.db
      
      # UNCOMMENT and configure this to pass your network drives/NAS into the container
      # so AOME can automatically transfer finished transcodes there:
      # Map /dev and /run/udev so the container can detect when discs are inserted/ejected in real-time
      - /dev:/dev
      - /run/udev:/run/udev:ro
      
    privileged: true # Mandatory for full SCSI command access to optical drives
    restart: unless-stopped
